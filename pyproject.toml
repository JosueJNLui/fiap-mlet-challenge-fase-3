# Configuração de ferramentas de análise estática (ty: https://ty.dev).
# O projeto usa requirements.txt para dependências; este arquivo é apenas
# config dos linters/type-checkers.
[tool.ty.src]
# `airflow/dags` só é executado dentro do ambiente Airflow, onde o pacote
# `apache-airflow` está instalado; aqui a pasta local `airflow/` ofuscaria o
# pacote real e o ty não conseguiria resolver `from airflow import DAG`.
#
# `docker/airflow_webserver_config.py` é lido pelo webserver dentro do container
# do Airflow, que tem `flask_appbuilder`; o venv local não tem.
exclude = ["airflow", "docker/airflow_webserver_config.py"]

[tool.pytest.ini_options]
# O starlette 0.38.x (fixado pelo fastapi==0.115.0) usa `anyio.abc.BlockingPortal`,
# alias depreciado no anyio >= 4.15. O aviso é interno da biblioteca; some ao
# atualizar o fastapi para uma versão com starlette mais recente.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]