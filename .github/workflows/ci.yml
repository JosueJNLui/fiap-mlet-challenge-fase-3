name: CI - Lint, Test & Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install flake8

      - name: Run flake8
        run: flake8 src tests

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-api.txt scikit-learn pandas pytest httpx skl2onnx==1.20.0 onnx==1.22.0

      - name: Gerar dataset sintético e treinar modelo (necessário para testes)
        run: |
          python data/generate_data.py
          python src/train.py
          python src/export_onnx.py

      - name: Rodar testes
        run: pytest tests/ -v

  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (para gerar artefatos do modelo)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências e gerar modelo
        run: |
          pip install -r requirements-api.txt scikit-learn pandas skl2onnx==1.20.0 onnx==1.22.0
          python data/generate_data.py
          python src/train.py
          python src/export_onnx.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: triagem-laudos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
