name: CI - Lint, Test & Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (flake8, hadolint, DCLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: make ci-install PY=python

      - name: Lint Python (flake8)
        run: make lint-python PY=python

      - name: Lint Dockerfile (hadolint)
        run: make lint-docker PY=python

      - name: Lint docker-compose (DCLint)
        run: make lint-compose PY=python

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make ci-install PY=python

      - name: Gerar dataset sintético e treinar modelo (necessário para testes)
        run: make model PY=python

      - name: Rodar testes
        run: make test PY=python

  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (para gerar artefatos do modelo)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências e gerar modelo
        run: |
          make ci-install PY=python
          make model PY=python

      - name: Build da imagem (sem push)
        run: make build IMAGE_TAG=${{ github.sha }}
