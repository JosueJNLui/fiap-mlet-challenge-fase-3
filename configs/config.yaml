# Configuração do pipeline de classificação de condições médicas
# Valores reprodutíveis (lidos pelo YAML); segredos via .env

seed: 42

paths:
  raw: "data/raw"
  processed: "data/processed"
  models: "models"

train:
  tfidf_max_features: 5000
  tfidf_ngram_range: [1, 2]
  rf_n_estimators: 100
  # Sem limite de profundidade; a poda vem do min_samples_leaf. class_weight compensa o
  # desbalanceamento (general pathological conditions tem ~3x mais amostras que digestive)
  rf_max_depth: null
  rf_min_samples_leaf: 10
  rf_class_weight: "balanced"
  rf_random_state: 42
  test_size: 0.2
  random_state: 42

mlflow:
  experiment_name: "Medical-Abstracts-Classification"

dagshub_repo_owner: "JosueJNLui"
dagshub_repo_name: "fiap-mlet-challenge-fase-3"