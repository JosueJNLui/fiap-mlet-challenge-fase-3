name: triagem

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: triagem-api
    environment:
      - MODEL_BACKEND=${MODEL_BACKEND:-onnx}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=triagem-api
      - OTEL_TRACES_SAMPLER=parentbased_always_on
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://prometheus:9090/api/v1/otlp/v1/metrics
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://loki:3100/otlp/v1/logs
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    ports:
      - '0.0.0.0:8000:8000'
    networks:
      - triagem-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: triagem-grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Streaming de traces usa gRPC derivado da URL do datasource (3200 = portas
      # HTTP do Tempo), o que gerava "http2: frame too large". Força o caminho HTTP.
      - GF_FEATURE_TOGGLES_DISABLE=traceQLStreaming
    ports:
      - '0.0.0.0:3000:3000'
    networks:
      - triagem-net
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    container_name: triagem-loki
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - '0.0.0.0:3100:3100'
    networks:
      - triagem-net
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: triagem-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '0.0.0.0:9090:9090'
    networks:
      - triagem-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-otlp-receiver'
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    container_name: triagem-tempo
    volumes:
      - ./tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '0.0.0.0:3200:3200'
      - '0.0.0.0:4318:4318'
    networks:
      - triagem-net
    command:
      - '-config.file=/etc/tempo.yaml'
    restart: unless-stopped

networks:
  triagem-net:
    driver: bridge

volumes:
  tempo-data:
  loki-data:
